<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek 电商客服话术生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 深色系背景，契合 DeepSeek 官网的科技感 */
        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #ffffff 100%);
            min-height: 100vh;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px 0 rgba(30, 58, 138, 0.1);
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="flex flex-col items-center p-4 text-gray-800 min-h-screen">

    <div class="w-full max-w-4xl mb-4">
        <details class="group bg-white/50 rounded-xl border border-gray-200 open:bg-white transition-all">
            <summary
                class="cursor-pointer p-3 font-medium text-gray-600 hover:text-purple-600 flex justify-between items-center">
                <span><i class="fas fa-robot mr-2"></i>设置 DeepSeek API Key</span>
                <span class="text-xs text-gray-400 group-open:hidden">点击配置</span>
            </summary>
            <div class="p-3 pt-0">
                <p class="text-xs text-gray-500 mb-2">Key 将仅存储在您的本地浏览器中。</p>
                <div class="flex gap-2">
                    <input type="password" id="apiKeyInput"
                        class="flex-1 p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-500 outline-none"
                        placeholder="请输入 DeepSeek API Key">
                    <button onclick="saveApiKey()"
                        class="bg-purple-800 text-white px-4 py-1 rounded-lg text-sm hover:bg-purple-700">保存</button>
                </div>
            </div>
        </details>
    </div>

    <div class="w-full max-w-4xl glass-effect rounded-2xl p-6 fade-in shadow-2xl mb-4">
        <div class="text-center mb-6">
            <div
                class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-purple-100 text-purple-600 mb-2">
                <i class="fas fa-meteor text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 mb-1">DeepSeek 智能客服话术生成器</h1>
            <p class="text-gray-500 text-sm">输入买家问题，AI 实时生成高情商回复</p>
        </div>

        <div id="errorMsg"
            class="hidden bg-red-50 text-red-600 p-3 rounded-xl mb-4 border border-red-100 text-xs text-center"></div>

        <div id="loading" class="hidden text-center py-6">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-600 mx-auto mb-2"></div>
            <p class="text-gray-500 animate-pulse text-sm">DeepSeek 正在为您生成话术...</p>
        </div>

        <div id="resultsArea" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">

            <div
                class="bg-pink-50 border border-pink-100 rounded-xl p-4 shadow-sm hover:shadow-lg transition relative group flex flex-col">
                <div class="flex items-center gap-2 mb-2">
                    <span class="bg-pink-200 text-pink-700 text-xs font-bold px-2 py-0.5 rounded-lg">❤️ 感性</span>
                </div>
                <p id="res1"
                    class="text-gray-700 leading-snug text-sm flex-grow whitespace-pre-wrap overflow-auto max-h-[120px]">
                </p> <button onclick="copyToClipboard('res1')"
                    class="mt-3 w-full py-1.5 text-xs font-semibold text-pink-600 bg-pink-100 rounded hover:bg-pink-200 transition">
                    <i class="far fa-copy mr-1"></i> 复制
                </button>
            </div>

            <div
                class="bg-blue-50 border border-blue-100 rounded-xl p-4 shadow-sm hover:shadow-lg transition relative group flex flex-col">
                <div class="flex items-center gap-2 mb-2">
                    <span class="bg-blue-200 text-blue-700 text-xs font-bold px-2 py-0.5 rounded-lg">💼 专业</span>
                </div>
                <p id="res2"
                    class="text-gray-700 leading-snug text-sm flex-grow whitespace-pre-wrap overflow-auto max-h-[120px]">
                </p> <button onclick="copyToClipboard('res2')"
                    class="mt-3 w-full py-1.5 text-xs font-semibold text-blue-600 bg-blue-100 rounded hover:bg-blue-200 transition">
                    <i class="far fa-copy mr-1"></i> 复制
                </button>
            </div>

            <div
                class="bg-green-50 border border-green-100 rounded-xl p-4 shadow-sm hover:shadow-lg transition relative group flex flex-col">
                <div class="flex items-center gap-2 mb-2">
                    <span class="bg-green-200 text-green-700 text-xs font-bold px-2 py-0.5 rounded-lg">✨ 幽默</span>
                </div>
                <p id="res3"
                    class="text-gray-700 leading-snug text-sm flex-grow whitespace-pre-wrap overflow-auto max-h-[120px]">
                </p> <button onclick="copyToClipboard('res3')"
                    class="mt-3 w-full py-1.5 text-xs font-semibold text-green-600 bg-green-100 rounded hover:bg-green-200 transition">
                    <i class="far fa-copy mr-1"></i> 复制
                </button>
            </div>
        </div>

        <div class="relative pt-2">
            <label class="block text-sm font-medium text-gray-700 mb-2">买家消息/场景描述</label>
            <textarea id="inputText" rows="3"
                class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition resize-none text-gray-700 placeholder-gray-400"
                placeholder="例如：衣服起球了，我要退货，运费谁出？"></textarea>

            <button onclick="callDeepSeekAPI()"
                class="mt-3 w-full bg-gradient-to-r from-purple-600 to-indigo-700 hover:from-purple-700 hover:to-indigo-800 text-white font-semibold py-3 px-6 rounded-xl shadow-lg transform transition hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2">
                <i class="fas fa-wand-magic-sparkles"></i> 立即生成话术
            </button>
        </div>
    </div>

    <script>
        const API_KEY_STORAGE_KEY = 'deepseek_api_key';

        document.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem(API_KEY_STORAGE_KEY);
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        });

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem(API_KEY_STORAGE_KEY, key);
                alert('DeepSeek API Key 已保存到本地浏览器！');
            } else {
                alert('请输入有效的 Key');
            }
        }

        async function callDeepSeekAPI() {
            const input = document.getElementById('inputText').value.trim();
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const loading = document.getElementById('loading');
            const resultsArea = document.getElementById('resultsArea');
            const errorMsg = document.getElementById('errorMsg');

            if (!apiKey) { alert("请先设置 API Key"); return; }
            if (!input) { alert("请输入买家问题"); return; }

            // 确保每次调用前，结果和错误区域都隐藏
            loading.classList.remove('hidden');
            resultsArea.classList.add('hidden');
            errorMsg.classList.add('hidden');

            const systemPrompt = `
你是资深电商客服，生成三条回复，每条回复的长度都必须严格控制在100个汉字以内：
1. 亲切感性（emotional）
2. 专业干练（professional）
3. 幽默/活泼（humorous）

请严格只返回一个 JSON 对象，格式：
{"emotional":"...","professional":"...","humorous":"..."}
不要添加任何额外文字、换行或 Markdown。
`;

            const messages = [
                { role: "system", content: systemPrompt },
                { role: "user", content: input }
            ];

            try {
                // DeepSeek API Endpoint
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: messages,
                        temperature: 1.0
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    let errorDetail = errText;
                    try {
                        const errJson = JSON.parse(errText);
                        errorDetail = errJson.error?.message || errText;
                    } catch (e) { /* ignore */ }

                    throw new Error(`API 请求失败: ${response.status} - ${errorDetail}`);
                }

                const data = await response.json();
                const text = data.choices[0].message.content;

                // 容错解析 JSON
                let parsed;
                try {
                    const match = text.match(/\{[\s\S]*\}/);
                    if (match) parsed = JSON.parse(match[0]);
                    else parsed = { emotional: text, professional: text, humorous: text };
                } catch (e) {
                    parsed = { emotional: text, professional: text, humorous: text };
                }

                document.getElementById('res1').innerText = parsed.emotional || "无内容";
                document.getElementById('res2').innerText = parsed.professional || "无内容";
                document.getElementById('res3').innerText = parsed.humorous || "无内容";

                loading.classList.add('hidden');
                resultsArea.classList.remove('hidden');
                resultsArea.classList.add('fade-in');

            } catch (err) {
                loading.classList.add('hidden');
                errorMsg.innerText = "发生错误: " + err.message;
                errorMsg.classList.remove('hidden');
            }
        }

        // 复制功能
        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.createElement('div');
                toast.className = 'fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg text-sm fade-in z-50';
                toast.innerText = '已复制 ✅';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            });
        }
    </script>
</body>

</html>
